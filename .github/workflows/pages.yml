name: Deploy Pages (staged)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deployment-not-enabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Deployment is intentionally disabled until the app and release checks exist.'
  # Replace this placeholder after release approval: configure-pages, setup-node,
  # npm ci, npm run build, upload-pages-artifact (dist), deploy-pages with
  # environment github-pages. Set Pages source to GitHub Actions in settings.
