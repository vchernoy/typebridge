name: CI
on:
  # Pushes to main run this workflow through the Pages gate (pages.yml), so
  # each main revision is checked once and deployed only if it passes.
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Upload the checked production build for Pages deployment.
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - name: Capture before and after UI
        if: matrix.browser == 'chromium' && contains(github.event.pull_request.body, '<!-- visual-evidence -->')
        env:
          VISUAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VISUAL_EXPECT_IDENTICAL: ${{ contains(github.event.pull_request.body, '<!-- visual-identical -->') }}
        run: node scripts/capture-ui.mjs
      - name: Compare before and after pixels
        if: matrix.browser == 'chromium' && contains(github.event.pull_request.body, '<!-- visual-identical -->')
        run: npx playwright test --config=playwright.visual.config.ts
      - name: Upload UI evidence
        if: always() && matrix.browser == 'chromium' && contains(github.event.pull_request.body, '<!-- visual-evidence -->')
        uses: actions/upload-artifact@v4
        with:
          name: ui-before-after-${{ github.event.pull_request.number }}
          path: |
            visual-evidence/
            test-results/
          retention-days: 7
          if-no-files-found: error
