name: PR 16 preview build
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  build-preview:
    if: github.event.pull_request.number == 16
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=/typebridge/preview/pr-16/
      - uses: actions/upload-artifact@v4
        with:
          name: pr-16-preview-build
          path: dist/
          retention-days: 7
