<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TypeBridge</title></head>
<body><main class="workspace"><header><p class="eyebrow">WRITE ACROSS ALPHABETS</p><h1>TypeBridge</h1><p>Type Russian using your Latin keyboard.</p></header>
<section aria-label="Editor"><div class="toolbar"><label class="toggle"><input id="enabled" type="checkbox" checked> Transliteration on</label><div class="actions"><button id="undo" type="button" disabled title="Undo (Cmd/Ctrl+Z)">Undo</button> <button id="redo" type="button" disabled title="Redo (Cmd/Ctrl+Shift+Z)">Redo</button> <button id="convert-cyrillic" type="button" title="Latin to Cyrillic (Cmd/Ctrl+Shift+L)">→ АБВ</button> <button id="convert-latin" type="button" title="Cyrillic to Latin (Cmd/Ctrl+Shift+K)">→ ABC</button> <button id="copy" type="button">Copy</button> <button id="clear" type="button">Clear</button></div></div>
<div class="find-bar" role="search" aria-label="Find and replace"><label for="find-text">Find</label><input id="find-text" type="text" autocomplete="off"><label for="replace-text">Replace</label><input id="replace-text" type="text" autocomplete="off"><label class="toggle"><input id="match-case" type="checkbox"> Match case</label><button id="find-next" type="button">Next</button><button id="find-prev" type="button">Previous</button><button id="replace-one" type="button">Replace</button><button id="replace-all" type="button">Replace all</button><span id="find-status" aria-live="polite"></span></div><div class="draft-bar"><label for="drafts">Drafts</label><select id="drafts" aria-label="Drafts"></select><button id="new-draft" type="button">New draft</button><button id="delete-draft" type="button">Delete draft</button><label for="draft-title">Title</label><input id="draft-title" type="text" aria-label="Draft title"><label class="toggle"><input id="autosave" type="checkbox" checked> Autosave</label></div><label for="editor">Your text</label><textarea id="editor" spellcheck="false" placeholder="Type privet to write привет"></textarea><div class="bottom"><span id="count">0 characters</span><span id="status" role="status" aria-live="polite"></span></div>
<p class="hint">Drafts are saved in this browser only. They are not synced between devices. Undo history is saved with drafts. Resize the editor from its bottom-right corner.</p></section></main><script type="module" src="/src/main.ts"></script></body></html>
