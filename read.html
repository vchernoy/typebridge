<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The shared text is in the link's #fragment, which never reaches a server; links are not indexed. -->
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <script>
      (() => {
        let choice = 'system';
        try {
          const saved = localStorage.getItem('typebridge.appearance.v1');
          if (saved === 'light' || saved === 'dark') choice = saved;
        } catch {
          /* System remains usable when storage is blocked. */
        }
        document.documentElement.dataset.colorScheme =
          choice === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : choice;
      })();
    </script>
    <title>Shared document · TypeBridge</title>
    <meta name="theme-color" content="#3153e9" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body class="read-page">
    <main class="read-main">
      <header class="read-heading">
        <h1 id="read-title" class="read-title">Opening shared document…</h1>
        <a id="edit-copy" class="read-edit" href="#" hidden>Edit</a>
      </header>
      <p id="read-notice" class="read-notice" hidden></p>
      <div id="read-text" class="read-text"></div>
      <p id="read-status" class="read-status" role="status" aria-live="polite"></p>
      <section id="reader-input-state" hidden aria-label="Local reader inputs">
        <p id="reader-input-status" role="status"></p>
        <button id="reader-input-reset" type="button">Reset inputs to defaults</button>
        <button id="reader-input-load" type="button" hidden>Load saved values</button>
        <button id="reader-input-keep" type="button" hidden>Keep these values</button>
      </section>
      <div id="read-edit-actions" class="read-edit-actions" hidden>
        <button id="check-owner-status" type="button">Check status</button>
        <button id="create-new-copy" type="button">Create new copy</button>
      </div>
    </main>
    <footer class="read-footer">Written with <a href="/">TypeBridge</a></footer>
    <script type="module" src="/src/read/main.ts"></script>
  </body>
</html>
